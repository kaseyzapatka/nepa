<style>
  .navbar .dropdown-submenu {
    position: relative;
  }

  .navbar .dropdown-submenu > .dropdown-menu {
    left: 100%;
    margin-top: -0.125rem;
    min-width: 14rem;
    position: absolute;
    top: 0;
    z-index: 1001;
  }

  .navbar .dropdown-submenu:hover > .dropdown-menu,
  .navbar .dropdown-submenu:focus-within > .dropdown-menu {
    display: block;
  }

  .navbar .dropdown-submenu > .dropdown-toggle::after {
    float: right;
    margin-left: 0.75rem;
    margin-top: 0.5rem;
    transform: rotate(-90deg);
  }

  @media (max-width: 991.98px) {
    .navbar .dropdown-submenu > .dropdown-menu {
      border: 0;
      box-shadow: none;
      left: 0;
      margin: 0;
      padding-left: 1rem;
      position: static;
    }

    .navbar .dropdown-submenu > .dropdown-toggle::after {
      transform: none;
    }
  }
</style>

<script>
  window.document.addEventListener("DOMContentLoaded", function () {
    const phase2Menu = window.document.querySelector("#nav-menu-phase-2 + .dropdown-menu");
    if (!phase2Menu) {
      return;
    }

    const menuItems = Array.from(phase2Menu.querySelectorAll("a.dropdown-item"));
    const overviewItem = menuItems.find((item) => item.textContent.trim() === "Overview");
    if (!overviewItem) {
      return;
    }

    const submenuConfigs = [
      ["Deliverable 1", [
        ["Report", "phase2/reports/deliverable01.html"],
        ["Coverage & Limitations", "phase2/notes/deliverable01/coverage_limitations.html"],
        ["Trigger Classification", "phase2/notes/deliverable01/trigger_classification.html"],
        ["Classification Scheme", "phase2/notes/deliverable01/classification_scheme.html"],
        ["Funding Mechanism Schema", "phase2/notes/deliverable01/funding_mechanism.html"]
      ]],
      ["Deliverable 2", [
        ["Report", "phase2/reports/deliverable02.html"],
        ["Coverage & Limitations", "phase2/notes/deliverable02/coverage_limitations.html"]
      ]],
      ["Deliverable 3", [
        ["Report", "phase2/reports/deliverable03.html"],
        ["Coverage & Limitations", "phase2/notes/deliverable03/coverage_limitations.html"]
      ]],
      ["Deliverable 4", [
        ["Report", "phase2/reports/deliverable04.html"],
        ["Coverage & Limitations", "phase2/notes/deliverable04/coverage_limitations.html"],
        ["Date Sourcing & Provenance", "phase2/notes/deliverable04/date_sourcing.html"],
        ["Known Issues & Deferred Items", "phase2/notes/deliverable04/known_issues.html"]
      ]],
      ["Deliverable 5", [
        ["Report", "phase2/reports/deliverable05.html"],
        ["Coverage & Limitations", "phase2/notes/deliverable05/coverage_limitations.html"]
      ]]
    ];

    submenuConfigs.forEach(function ([menuText, submenuItems]) {
      const deliverableItem = menuItems.find((item) => item.textContent.trim() === menuText);
      if (!deliverableItem) {
        return;
      }

      const siteRoot = deliverableItem.href
        .replace(/phase2\/reports\/deliverable\d+\.html$/, "");

      const deliverableParent = deliverableItem.closest("li");
      const submenu = window.document.createElement("ul");
      submenu.className = "dropdown-menu";

      submenuItems.forEach(function ([label, path]) {
        const item = window.document.createElement("li");
        const link = window.document.createElement("a");
        const text = window.document.createElement("span");

        link.className = "dropdown-item";
        link.href = siteRoot + path;
        text.className = "dropdown-text";
        text.textContent = label;

        link.appendChild(text);
        item.appendChild(link);
        submenu.appendChild(item);
      });

      deliverableItem.classList.add("dropdown-toggle");
      deliverableItem.setAttribute("aria-expanded", "false");
      deliverableItem.removeAttribute("data-bs-toggle");
      deliverableItem.setAttribute("role", "menuitem");

      deliverableParent.addEventListener("mouseenter", function () {
        submenu.classList.add("show");
        deliverableItem.setAttribute("aria-expanded", "true");
      });

      deliverableParent.addEventListener("mouseleave", function () {
        submenu.classList.remove("show");
        deliverableItem.setAttribute("aria-expanded", "false");
      });

      deliverableItem.addEventListener("click", function (event) {
        if (window.matchMedia("(min-width: 992px)").matches) {
          return;
        }

        event.preventDefault();
        submenu.classList.toggle("show");
        deliverableItem.setAttribute(
          "aria-expanded",
          submenu.classList.contains("show") ? "true" : "false"
        );
      });

      window.document.addEventListener("click", function (event) {
        if (!deliverableParent.contains(event.target)) {
          submenu.classList.remove("show");
          deliverableItem.setAttribute("aria-expanded", "false");
        }
      });

      deliverableParent.classList.add("dropdown-submenu");
      deliverableParent.appendChild(submenu);
    });
  });
</script>
