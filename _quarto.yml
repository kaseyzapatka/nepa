            href: phase1/reports/deliverable04.qmd
          - text: "Deliverable 5"
            href: phase1/reports/deliverable05.qmd
          - text: "Deliverable 6"
            href: phase1/reports/deliverable06.qmd
      - text: "Phase 2"
