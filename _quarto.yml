          - text: "Deliverable 2"
            href: phase2/reports/deliverable02.html
          - text: "Deliverable 3"
            href: phase2/reports/deliverable03.html
          - text: "Deliverable 4"
            href: phase2/reports/deliverable04.html
          - text: "Deliverable 5"
