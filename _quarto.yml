project:
  type: website
  output-dir: docs
  render:
    - "phase1/reports/*.qmd"
    - "phase2/reports/*.qmd"
    - "phase2/notes/deliverable01/*.md"
    - "phase2/notes/deliverable02/coverage_limitations.md"
    - "phase2/notes/deliverable03/coverage_limitations.md"
    - "phase2/notes/deliverable04/*.md"
    - "phase2/notes/deliverable05/coverage_limitations.md"
    - "phase2/notes/deliverable06/coverage_limitations.md"
    - "phase2/notes/deliverable06/ce_ecfr_verification.md"
    - "technical_reports/*.qmd"
    - "presentations/*.qmd"
    - "index.qmd"
    - "project_overview.qmd"
  # Refuses to build on Quarto < 1.10 (older versions silently drop the
  # screen-reader-only callout labels). `quarto-required` does not enforce
  # this for projects, so it is done here.
  pre-render:
    - scripts/check_quarto_version.sh
  post-render:
    - scripts/render_pdfs.sh

